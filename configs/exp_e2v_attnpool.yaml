include: data.yaml
name: e2v_attnpool                       # emotion2vec chunk embeddings -> gated attention pooling -> PHQ-8
target: phq_score
features:
  - name: e2v_plus_large_full
model:
  type: attnpool
  hidden: 128
  dropout: 0.3
train:
  seeds: [0, 1, 2, 3, 4]                 # train -> dev / test predictions (seed-averaged by 04_evaluate)
  cv_seeds: [0, 1, 2]                    # 5-fold CV on train+dev, one repetition per seed
  early_stop_frac: 0.2                   # early stopping on 20% of the TRAINING data (never on dev)
  epochs: 150
  patience: 25
  lr: 1.0e-3
  weight_decay: 1.0e-2
  batch_size: 16
  loss: mse+ccc
  segment_dropout: 0.1
  max_segments: 400
  device: cpu                            # cuda inside a GPU job
eval:
  threshold: 10
  cv: true
